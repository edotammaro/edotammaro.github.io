<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06090e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f3ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bgGlow)"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  
  <!-- Silhouette / Placeholder Graphic -->
  <g fill="none" stroke="url(#cyberBorder)" stroke-width="2" opacity="0.85">
    <!-- Target brackets -->
    <path d="M 50,70 L 50,50 L 70,50" />
    <path d="M 350,70 L 350,50 L 330,50" />
    <path d="M 50,330 L 50,350 L 70,350" />
    <path d="M 350,330 L 350,350 L 330,350" />
    <!-- Center radar rings -->
    <circle cx="200" cy="200" r="140" stroke="#00f3ff" stroke-opacity="0.2" stroke-dasharray="4 6"/>
    <circle cx="200" cy="200" r="100" stroke="#00ff9d" stroke-opacity="0.3"/>
  </g>
  
  <!-- Stylized avatar outline -->
  <g fill="#00f3ff" fill-opacity="0.1" stroke="#00f3ff" stroke-width="2.5">
    <circle cx="200" cy="150" r="48" />
    <path d="M 120,310 C 120,245 155,230 200,230 C 245,230 280,245 280,310 Z" />
  </g>
  
  <!-- Terminal scan line & tech status -->
  <text x="200" y="340" fill="#00ff9d" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="3">[ EDOARDO TAMMARO ]</text>
  <text x="200" y="360" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="1">SYSTEM PROFILE_ID // 0xET26</text>
</svg>
